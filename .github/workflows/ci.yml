# CI-style check: the same commands a developer runs locally (see README, Phase 4).
# Fully offline: tests use httpx.MockTransport and temporary SQLite files, so no secrets and no
# network access beyond installing public packages. The slow 2.4M-row performance test stays
# opt-in (`pytest -m slow`). The web extra is installed so the Streamlit UI tests (tests/ui) run on
# every push too. The workflow starts running once the repository is published.
name: ci

on:
  push:
  pull_request:

# The workflow only reads the repository (checkout); nothing here needs a write token.
permissions:
  contents: read

# A newer push to the same ref makes an older, still running check obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[web,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test (offline)
        run: pytest -q

# CI-style check: the same commands a developer runs locally (see README, Phase 4).
# Fully offline: tests use httpx.MockTransport and temporary SQLite files, so no secrets and no
# network access beyond installing public packages. The slow 2.4M-row performance test stays
# opt-in (`pytest -m slow`). The workflow starts running once the repository is published.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test (offline)
        run: pytest -q

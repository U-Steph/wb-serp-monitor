[theme]
base = "light"
primaryColor = "#7B10F5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F6F9"
textColor = "#1F1F29"
linkColor = "#4A0E8F"
font = "Montserrat:https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap, sans-serif"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["28px", "20px", "17px"]
headingFontWeights = [800, 700, 700]
metricValueFontSize = "26px"
metricValueFontWeight = 800
baseRadius = "12px"
borderColor = "#E7E7EE"
showWidgetBorder = true
greenColor = "#2BBF7E"
redColor = "#EF6B6F"
orangeColor = "#F08A24"
yellowColor = "#F5B04A"
yellowTextColor = "#7A4E00"
grayColor = "#6E6E80"
chartCategoricalColors = ["#7B10F5", "#F0368F", "#13A89E", "#F59E0B", "#2563EB", "#E5484D", "#0EA5E9", "#65A30D", "#9333EA", "#EA580C", "#0F766E", "#DB2777", "#4F46E5", "#CA8A04", "#475569"]

[client]
toolbarMode = "minimal"
# Public app: no tracebacks and no database path in the browser (details go to the server log).
showErrorDetails = "none"
# st.dataframe's own toolbar would export raw cell text (seller names, ...) as CSV / clipboard,
# bypassing the formula-injection guard of the app's own «Скачать CSV» button.
disableDataExport = true

[browser]
gatherUsageStats = false
